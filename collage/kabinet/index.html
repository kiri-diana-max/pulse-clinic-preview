<title>Пульс клиники</title>

<style>
/* Layout: одна колонка-инструмент; шапка с вкладками, слева итог месяца, ниже график года и разбивки. Хирургия — «операционный» зелёный, стоматология — янтарь. */
:root{
  --bg:#f4f6f4; --surface:#ffffff; --sunk:#eef2ef; --ink:#14201d; --muted:#5b6965; --line:#d9e1dc;
  --accent:#0d6b5a; --accent-ink:#ffffff; --amber:#b8711f;
  --bad:#b42318; --bad-bg:#fde8e6; --good:#1f7a3a; --good-bg:#e4f4e8; --warn:#9a5b00; --warn-bg:#fff3d6;
  --s1:#0d6b5a; --s2:#2f9a7f; --s3:#86c9b3; --d1:#b8711f; --d2:#d9963f; --d3:#ecbd7b; --d4:#f5dcb4;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#171f1d; --sunk:#1d2724; --ink:#e7eeeb; --muted:#9aaba6; --line:#2c3935;
  --accent:#3fb596; --accent-ink:#06201a; --amber:#e3a35a;
  --bad:#ff8a7a; --bad-bg:#3a1b17; --good:#6fd38f; --good-bg:#16301f; --warn:#f2c26b; --warn-bg:#352a12;
  --s1:#3fb596; --s2:#2a8670; --s3:#1d5a4b; --d1:#e3a35a; --d2:#c4843c; --d3:#9a6630; --d4:#6e4a25;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#171f1d; --sunk:#1d2724; --ink:#e7eeeb; --muted:#9aaba6; --line:#2c3935;
  --accent:#3fb596; --accent-ink:#06201a; --amber:#e3a35a;
  --bad:#ff8a7a; --bad-bg:#3a1b17; --good:#6fd38f; --good-bg:#16301f; --warn:#f2c26b; --warn-bg:#352a12;
  --s1:#3fb596; --s2:#2a8670; --s3:#1d5a4b; --d1:#e3a35a; --d2:#c4843c; --d3:#9a6630; --d4:#6e4a25;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{margin-top:16px;padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn);font-size:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.banner.info{background:var(--sunk);color:var(--muted)}
section.view{margin-top:20px;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
select,input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input.amt{font-family:var(--f-num);text-align:right;width:100%}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-weight:500;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);font:inherit;font-weight:500;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

/* Обзор */
.monthhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .d{font-size:13px;color:var(--muted)}
.kpi .d.up{color:var(--good)} .kpi .d.down{color:var(--bad)}
.signals{display:flex;flex-direction:column;gap:8px}
.sig{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:14px}
.sig b{font-weight:600}
.sig.bad{background:var(--bad-bg);color:var(--bad)}
.sig.warn{background:var(--warn-bg);color:var(--warn)}
.sig.good{background:var(--good-bg);color:var(--good)}
.sig .dot{flex:none;width:8px;height:8px;border-radius:50%;background:currentColor;margin-top:7px}
.wingbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk)}
.wingbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right}
tr.wing td{font-weight:600;background:var(--sunk)}
.tablewrap{overflow-x:auto}
.chartwrap{overflow-x:auto}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
svg .gl{stroke:var(--line)}
.bar{cursor:pointer}
.bar.sel rect{stroke:var(--ink);stroke-width:1.5}
.target-line{stroke:var(--bad);stroke-dasharray:4 3}

/* Ввод */
.formgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.revrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) minmax(0,1fr) 72px 34px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.revrow.head{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
@media (max-width:640px){.revrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}.revrow.head{display:none}.revrow .pct{grid-column:auto}}
.revrow .note{grid-column:1/-1;font-size:13px}
.note.warn{color:var(--warn)} .note.bad{color:var(--bad)}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;line-height:1}
.kv{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:6px 12px;align-items:center}
@media (max-width:480px){.kv{grid-template-columns:minmax(0,1fr) 120px}}
.kv label{font-size:14px}
.kv .auto{font-family:var(--f-num);text-align:right;padding:7px 10px;color:var(--muted)}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.cols2{grid-template-columns:minmax(0,1fr)}}
.savebar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.confirmline{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--warn)}
.toast{font-size:14px;font-weight:500}
.toast.ok{color:var(--good)} .toast.err{color:var(--bad)}

/* История */
.log{display:flex;flex-direction:column}
.logitem{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
@media (max-width:560px){.logitem{grid-template-columns:minmax(0,1fr)}}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.docrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 34px;gap:8px;align-items:center;padding:4px 0}
/* Стартовая */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:12px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-text{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.hero-h{font-size:clamp(26px,4vw,38px);line-height:1.12;font-weight:700;letter-spacing:-.02em;max-width:18ch}
.hero-p{margin:0;color:var(--muted);font-size:16px;max-width:56ch}
.hero-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(13,107,90,.08)}
a.btn{text-decoration:none;display:inline-block}
.features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:820px){.features{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.features{grid-template-columns:minmax(0,1fr)}}
.feat{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.feat h3{color:var(--ink);text-transform:none;letter-spacing:0;font-size:15px}
.feat p{margin:0;color:var(--muted);font-size:14px}
.author{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;background:var(--sunk);border-radius:14px;padding:24px;align-items:start}
@media (max-width:820px){.author{grid-template-columns:minmax(0,1fr)}}
.author-text{display:flex;flex-direction:column;gap:8px}
.author-text p{margin:0;max-width:60ch}
.contacts{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.contact{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.contact:hover{border-color:var(--accent)}
.c-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.c-val{font-weight:600;color:var(--accent);word-break:break-all}
.foot{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;font-size:13px;color:var(--muted)}
.foot a,.banner a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.bar rect{transition:opacity .15s}}
</style>

<script>
(() => {
const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MS = ["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
const DIRS = [
  {id:"blef", name:"Блефаропластика", wing:"S", c:"--s1"},
  {id:"impl", name:"Имплантация", wing:"S", c:"--s2"},
  {id:"surg", name:"Хирургия (прочее)", wing:"S", c:"--s3"},
  {id:"orth", name:"Ортопедия", wing:"D", c:"--d1"},
  {id:"ther", name:"Терапия", wing:"D", c:"--d2"},
  {id:"ortd", name:"Ортодонтия", wing:"D", c:"--d3"},
  {id:"hyg", name:"Гигиена", wing:"D", c:"--d4"},
];
const DIRMAP = Object.fromEntries(DIRS.map(d=>[d.id,d]));
const EXP = [
  ["admins","ФОТ администраторы"],["assist","ФОТ ассистенты, медсёстры"],["cleaner","ФОТ санитар, уборка"],["payroll_tax","Налоги и взносы с ФОТ"],
  ["rent","Аренда"],["utilities","Коммунальные, связь, интернет"],["materials","Расходные материалы"],["implants","Импланты и компоненты"],
  ["lab","Зуботехническая лаборатория"],["meds","Медикаменты, анестезия"],["smm","Маркетинг: СММ, съёмка"],["ads","Маркетинг: реклама, агрегаторы"],
  ["it","Сайт, МедЛок, программы"],["equip","Обслуживание оборудования"],["sanit","Дезинфекция, медотходы, стирка"],["household","Хозяйственные нужды"],
  ["training","Обучение персонала"],["bank","Банк, эквайринг, кассы"],["tax","Налог клиники (УСН и др.)"],["other","Прочее"]];
const SOURCES = [["word","Сарафан, рекомендация"],["insta","Instagram, соцсети"],["vk","ВКонтакте"],["site","Сайт"],["ymaps","Яндекс Карты"],["prodoc","ПроДокторов"],["gis","2ГИС"],["other","Другое"]];
const DEFAULT_SETTINGS = {name:"Клиника Тулпарович", target:400000, shareAlarm:0.8, dropAlarm:0.1, doctors:[]};

const $ = (s,el=document)=>el.querySelector(s);
const fmt = new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0});
const rub = v => fmt.format(Math.round(v||0)) + " ₽";
const pct = v => (isFinite(v)? (v*100).toFixed(1).replace(".",",") : "0") + "%";
const parseAmt = s => { const n = Number(String(s??"").replace(/\s/g,"").replace(",",".").replace(/[^\d.]/g,"")); return isFinite(n)? n : 0; };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mkey = (y,m) => `${y}-${String(m+1).padStart(2,"0")}`;
const mlabel = k => { const [y,m]=k.split("-"); return `${MONTHS[+m-1]} ${y}`; };
const prevKey = k => { let [y,m]=k.split("-").map(Number); m-=1; if(m===0){m=12;y-=1;} return `${y}-${String(m).padStart(2,"0")}`; };
const uid = () => Math.random().toString(36).slice(2,9);

const now = new Date();
const state = {
  tab:"home", demo:false, db:null, user:null, uid:null, canWrite:false, canEdit:false, ready:false,
  settings:{...DEFAULT_SETTINGS}, months:{}, log:[],
  selKey: mkey(now.getFullYear(), now.getMonth()===0?0:now.getMonth()-1), year: now.getFullYear(),
  draft:null, draftKey:null, confirmChecked:false, toast:null, names:{}, confirmDelete:false
};
try { const t = localStorage.getItem("pulse.tab"); if (t) state.tab = t; } catch(e){}

/* ---------- demo data (never written to the store) ---------- */
function demoData(){
  const doctors=[{id:"d1",name:"Доктор Ватсон",pct:40},{id:"d2",name:"Доктор Клаус",pct:35},{id:"d3",name:"Доктор Хаус",pct:30}];
  const months={};
  for(let m=0;m<9;m++){
    const k=mkey(2026,m), w=1+Math.sin(m/2)*0.12;
    months[k]={month:k,
      revenue:[{doctorId:"d1",direction:"blef",amount:Math.round(620000*w/1000)*1000,pct:40},{doctorId:"d1",direction:"impl",amount:Math.round(380000*w/1000)*1000,pct:40},
        {doctorId:"d2",direction:"impl",amount:Math.round(240000*(1+m*0.03)/1000)*1000,pct:35},{doctorId:"d3",direction:"orth",amount:Math.round(90000*(1+m*0.05)/1000)*1000,pct:30},
        {doctorId:"d3",direction:"ther",amount:Math.round(70000/1000)*1000,pct:30},{doctorId:"d3",direction:"ther",amount:Math.round((80000+m*6000)/1000)*1000,pct:30}],
      expenses:{admins:120000,assist:140000,cleaner:30000,payroll_tax:85000,rent:180000,utilities:25000,materials:Math.round(70000*w),implants:Math.round(160000*w),lab:60000,meds:20000,smm:45000,ads:20000,it:12000,sanit:9000,household:8000,bank:18000,tax:Math.round(70000*w)},
      patients:{sources:{word:Math.round(18*w),insta:9,vk:3,site:6,ymaps:7,prodoc:5,gis:2,other:1},started:Math.round(34*w),repeat:110,routed:3+(m%3)}};
  }
  months["2026-09"].revenue[0].amount=430000; // просадка для примера
  return {settings:{...DEFAULT_SETTINGS,name:"Клиника TEPLOFF",doctors},months};
}

/* ---------- calculations ---------- */
function calc(k, src){
  const S = src.settings, M = src.months[k];
  const r = {key:k, has:!!M, rev:0, byDir:{}, byDoc:{}, fot:0, expOther:0, exp:0, profit:0, margin:0, surg:0, dent:0, share:0, prim:0, started:0, conv:0, repeat:0, routed:0, ther:0};
  DIRS.forEach(d=>r.byDir[d.id]=0);
  if(!M) return r;
  (M.revenue||[]).forEach(x=>{ const a=+x.amount||0; r.rev+=a; if(r.byDir[x.direction]!==undefined) r.byDir[x.direction]+=a; r.byDoc[x.doctorId]=(r.byDoc[x.doctorId]||0)+a; r.fot+=a*(+x.pct||0)/100; });
  r.expOther = Object.values(M.expenses||{}).reduce((s,v)=>s+(+v||0),0);
  r.exp = r.fot + r.expOther; r.profit = r.rev - r.exp; r.margin = r.rev? r.profit/r.rev : 0;
  DIRS.forEach(d=>{ if(d.wing==="S") r.surg+=r.byDir[d.id]; else r.dent+=r.byDir[d.id]; });
  r.share = r.rev? r.surg/r.rev : 0; r.ther = r.byDir.ther;
  const P = M.patients||{};
  r.prim = Object.values(P.sources||{}).reduce((s,v)=>s+(+v||0),0);
  r.started=+P.started||0; r.repeat=+P.repeat||0; r.routed=+P.routed||0; r.conv = r.prim? r.started/r.prim : 0;
  return r;
}
function signals(c, prev, S){
  const out=[];
  if(!c.has) return out;
  if(c.ther < S.target) out.push(["bad",`<b>Терапия ниже цели.</b> ${rub(c.ther)} при цели ${rub(S.target)}, не хватает ${rub(S.target-c.ther)}.`]);
  if(prev.has && prev.rev>0){ const d=c.rev/prev.rev-1; if(d < -S.dropAlarm) out.push(["bad",`<b>Выручка упала на ${pct(-d)}</b> к прошлому месяцу (${rub(prev.rev)} → ${rub(c.rev)}).`]); }
  if(c.profit<0) out.push(["bad",`<b>Убыток ${rub(-c.profit)}.</b> Расходы больше выручки.`]);
  if(c.rev>0 && c.share > S.shareAlarm) out.push(["warn",`<b>Хирургия даёт ${pct(c.share)} выручки.</b> Клиника держится на одном крыле, стоматологии нужен рост.`]);
  if(c.rev>0 && c.prim===0) out.push(["warn",`<b>Нет данных об источниках пациентов.</b> Попросите администраторов отмечать в МедЛоке, откуда пришёл пациент.`]);
  if(c.prim>0 && c.routed===0 && c.surg>0) out.push(["warn",`<b>Ни один хирургический пациент не записан в терапию или ортопедию.</b> Маршрут «после хирургии» не работает.`]);
  if(!out.length) out.push(["good","<b>Красных сигналов нет.</b> Месяц в норме по всем порогам."]);
  return out;
}

function chart(y, S){
  const W=860,H=260,pl=64,pr=12,pt=12,pb=28; const iw=W-pl-pr, ih=H-pt-pb;
  const cs = MS.map((_,m)=>calc(mkey(y,m),S));
  const max = Math.max(S.settings.target*1.2, ...cs.map(c=>c.rev), 1);
  const step = niceStep(max/4); const top = Math.ceil(max/step)*step;
  const yv = v => pt + ih - v/top*ih; const bw = iw/12*0.62;
  let g = "";
  for(let t=0;t<=top+1;t+=step){ g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${yv(t)}" y2="${yv(t)}"/><text x="${pl-8}" y="${yv(t)+4}" text-anchor="end">${short(t)}</text>`; }
  cs.forEach((c,m)=>{
    const x = pl + iw/12*m + (iw/12-bw)/2; let acc=0; let rects="";
    DIRS.forEach(d=>{ const a=c.byDir[d.id]; if(a>0){ rects+=`<rect x="${x}" y="${yv(acc+a)}" width="${bw}" height="${yv(acc)-yv(acc+a)}" fill="var(${d.c})"><title>${MS[m]}: ${d.name} ${rub(a)}</title></rect>`; acc+=a; } });
    if(!c.has) rects+=`<rect x="${x}" y="${yv(0)-2}" width="${bw}" height="2" fill="var(--line)"/>`;
    const sel = mkey(y,m)===state.selKey;
    g+=`<g class="bar ${sel?"sel":""}" data-month="${mkey(y,m)}" tabindex="0" role="button" aria-label="${MONTHS[m]}: ${rub(c.rev)}">${rects}<rect x="${x-4}" y="${pt}" width="${bw+8}" height="${ih}" fill="transparent"/></g>`;
    g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" ${sel?'style="fill:var(--ink);font-weight:600"':""}>${MS[m]}</text>`;
    if(c.has) g+=`<line class="target-line" x1="${x-3}" x2="${x+bw+3}" y1="${yv(S.settings.target)}" y2="${yv(S.settings.target)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px;display:block" role="img" aria-label="Выручка по месяцам">${g}</svg>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))); const n=x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function short(v){ return v>=1e6? (v/1e6).toFixed(v%1e6?1:0).replace(".",",")+" млн" : v>=1e3? Math.round(v/1e3)+" тыс" : "0"; }

function startDraft(k){

  let d = base || blankMonth(k);
  if(!base){
    const prev = state.months[prevKey(k)];
    if(prev) d.revenue = prev.revenue.map(x=>({doctorId:x.doctorId,direction:x.direction,pct:x.pct,amount:""}));
    else d.revenue = (state.settings.doctors||[]).flatMap(doc=>(doc.dirs||[]).map(dir=>({doctorId:doc.id,direction:dir,pct:doc.pct,amount:""})));
    if(!d.revenue.length) d.revenue=[{doctorId:"",direction:"",pct:"",amount:""}];
  }
  d.revenue.forEach(x=>x._id=x._id||uid());
  state.draft=d; state.draftKey=k; state.confirmChecked=false; state.confirmDelete=false; state.toast=null;
}
function rowChecks(x, k){
  const a = parseAmt(x.amount); const notes=[];
  if(x.amount!=="" && (!x.doctorId || !x.direction)) notes.push(["bad","Выберите врача и направление, иначе сумма не попадёт в разбивку."]);
  if(a>50000000) notes.push(["bad","Больше 50 млн ₽ за месяц по одной строке. Проверьте лишние нули."]);
  const prev = state.months[prevKey(k)];
  if(prev && a>0){
    const pa = prev.revenue.filter(r=>r.doctorId===x.doctorId && r.direction===x.direction).reduce((s,r)=>s+(+r.amount||0),0);
    if(pa>0 && a>pa*4) notes.push(["warn",`В ${Math.round(a/pa)} раз больше прошлого месяца (${rub(pa)}). Точно?`]);
    if(pa>0 && a<pa/4) notes.push(["warn",`В ${Math.round(pa/a)} раз меньше прошлого месяца (${rub(pa)}). Точно?`]);
  }
  const p = parseAmt(x.pct); if(x.pct!=="" && p>100) notes.push(["bad","Процент врачу не может быть больше 100."]);
  return notes;
}

  if(!state.log.length){ v.innerHTML=`<div class="panel"><div class="empty"><h2>Изменений пока нет</h2><p class="muted">Каждое сохранение и удаление месяца попадает сюда: кто, когда и что поменял.</p></div></div>`; return; }
  const ids=[...new Set(state.log.map(x=>x.by).filter(Boolean))];
  if(state.user && ids.length){ try{ const ps=await state.user.profiles(ids); ids.forEach(id=>state.names[id]=(ps[id]&&ps[id].name)||""); }catch(e){} }
  v.innerHTML=`<div class="panel"><h2 style="margin-bottom:8px">История изменений</h2><div class="log">${state.log.map(x=>`<div class="logitem"><span class="muted num" style="font-size:13px">${new Date(x.at).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}</span><span><b class="who" data-uid="${esc(x.by||"")}"></b> ${esc(x.text)}</span></div>`).join("")}</div></div>`;
  v.querySelectorAll(".who").forEach(el=>{ el.textContent = (state.names[el.dataset.uid]||"Участник") + ":"; });
}

      </div>
    </div>
  </div>
  ${ro?"":`<div class="savebar"><span class="toast ${state.stoast?state.stoast[0]:""}">${state.stoast?esc(state.stoast[1]):""}</span><button class="btn primary" id="saveSettings">Сохранить настройки</button></div>`}`;
}

/* ---------- render: home (продающая стартовая) ---------- */

/* ---------- shell ---------- */
function renderBanner(){
  const b=$("#banner");
  if(state.demo) b.innerHTML=`<div class="banner"><span><b>Это пример с выдуманными цифрами</b>, не данные клиники. Хотите так же для своей клиники? <a href="https://t.me/TeplovaDiana" target="_blank" rel="noopener">Напишите Диане</a></span><button class="btn small" data-demo="off">Выйти из примера</button></div>`;
  else if(state.ready && !state.db) b.innerHTML=`<div class="banner">Хранилище данных недоступно в этом окне. Откройте страницу на claude.ai, войдя в аккаунт. Пока можно <button class="link" data-demo="on">посмотреть пример</button>.</div>`;
  else b.innerHTML="";
}
function render(){
  $("#clinicName").textContent = state.demo? "Клиника TEPLOFF · пример" : (state.settings.name || "Пульс клиники");
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===state.tab)));
  ["home","overview","entry","history","settings"].forEach(t=>$("#v-"+t).hidden = t!==state.tab);
  renderBanner();
  if(state.tab==="home") renderHome();
  if(state.tab==="overview") renderOverview();
  if(state.tab==="entry") renderEntry();
  if(state.tab==="history") renderHistory();
  if(state.tab==="settings") renderSettings();
}
function go(tab){ state.tab=tab; try{localStorage.setItem("pulse.tab",tab);}catch(e){} if(tab==="settings") state.sdraft=null; render(); window.scrollTo({top:0}); }

/* keep focus when re-rendering the entry form */
function rerenderKeep(){ const id=document.activeElement&&document.activeElement.id; const pos=document.activeElement&&document.activeElement.selectionStart; render(); if(id){ const el=document.getElementById(id); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(el.value.length,el.value.length);}catch(e){} } } }

document.addEventListener("click", async e=>{
  const t=e.target.closest("button, g.bar"); if(!t) return; if(t.tagName==="A") return;
  if(t.matches("nav.tabs button")) return go(t.dataset.tab);
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.demo){ state.demo = t.dataset.demo==="on"; if(state.demo){state.tab="overview"; state.selKey="2026-09";} else { const ks=Object.keys(state.months).sort(); if(ks.length) state.selKey=ks[ks.length-1]; } return render(); }
  if(t.dataset.edit){ state.selKey=t.dataset.edit; state.draft=null; return go("entry"); }
  if(t.matches("g.bar")){ state.selKey=t.dataset.month; return render(); }
  if(t.dataset.addrow!==undefined){ state.draft.revenue.push({_id:uid(),doctorId:"",direction:"",pct:"",amount:""}); return render(); }
  if(t.dataset.delrow!==undefined){ state.draft.revenue.splice(+t.dataset.delrow,1); if(!state.draft.revenue.length) state.draft.revenue.push({_id:uid(),doctorId:"",direction:"",pct:"",amount:""}); return render(); }
  if(t.dataset.delmonth==="ask"){ state.confirmDelete=true; return render(); }
  if(t.dataset.delmonth==="no"){ state.confirmDelete=false; return render(); }
  if(t.dataset.delmonth==="yes") return deleteMonth();
  if(t.id==="saveBtn") return saveMonth();
  if(t.dataset.adddoc!==undefined){ state.sdraft.doctors.push({id:"d"+uid(),name:"",pct:"",dirs:[]}); return render(); }
  if(t.dataset.deldoc!==undefined){ state.sdraft.doctors.splice(+t.dataset.deldoc,1); return render(); }
  if(t.id==="saveSettings") return saveSettings();
  if(t.id==="copyTg"){ const m=$("#copyMsg"); try{ await navigator.clipboard.writeText("@TeplovaDiana"); m.textContent="Скопировано"; }catch(err){ m.textContent="Ник: @TeplovaDiana"; } return; }
});
document.addEventListener("keydown", e=>{ const g=e.target.closest&&e.target.closest("g.bar"); if(g&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); state.selKey=g.dataset.month; render(); } });
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="ov-m"||t.id==="ov-y"){ state.selKey=mkey(+$("#ov-y").value, +$("#ov-m").value); return render(); }
  if(t.id==="en-m"||t.id==="en-y"){ state.selKey=mkey(+$("#en-y").value, +$("#en-m").value); state.draft=null; return render(); }
  if(t.id==="confirmWarn"){ state.confirmChecked=t.checked; return render(); }
  const row=t.closest(".revrow");
  if(row && t.tagName==="SELECT"){ const x=state.draft.revenue[+row.dataset.row]; x[t.dataset.f]=t.value;
    if(t.dataset.f==="doctorId" && (x.pct===""||x.pct==null)){ const doc=(state.settings.doctors||[]).find(d=>d.id===t.value); if(doc&&doc.pct!=="") x.pct=doc.pct; }
    return render(); }
  if(t.dataset.dd!==undefined){ const doc=state.sdraft.doctors[+t.dataset.dd]; const s=new Set(doc.dirs||[]); t.checked?s.add(t.value):s.delete(t.value); doc.dirs=[...s]; }
});
document.addEventListener("input", e=>{
  const t=e.target; if(state.demo) return;
  const row=t.closest(".revrow");
  if(row && t.dataset.f){ state.draft.revenue[+row.dataset.row][t.dataset.f] = t.dataset.f==="amount"? String(parseAmt(t.value)||"") : t.value.replace(/[^\d.,]/g,""); }
  else if(t.dataset.exp) state.draft.expenses[t.dataset.exp]=parseAmt(t.value);
  else if(t.dataset.src) state.draft.patients.sources[t.dataset.src]=parseAmt(t.value);
  else if(t.dataset.p) state.draft.patients[t.dataset.p]=parseAmt(t.value);
  else if(t.dataset.dn!==undefined){ state.sdraft.doctors[+t.dataset.dn].name=t.value; return; }
  else if(t.dataset.dp!==undefined){ state.sdraft.doctors[+t.dataset.dp].pct=t.value.replace(/[^\d.,]/g,""); return; }
  else return;
  clearTimeout(state._rt); state._rt=setTimeout(rerenderKeep, 450);
});

/* ---------- writes ---------- */
async function addLog(text){ if(!state.db) return; try{ await state.db.collection("log").add({at:Date.now(), by:state.uid||"", text}); }catch(e){} }
async function saveMonth(){
  const btn=$("#saveBtn"); if(btn) btn.disabled=true;
  const d=state.draft, k=state.draftKey;
  const clean={month:k,
    revenue:d.revenue.filter(x=>parseAmt(x.amount)>0).map(x=>({doctorId:x.doctorId,direction:x.direction,amount:parseAmt(x.amount),pct:parseAmt(x.pct)})),
    expenses:Object.fromEntries(EXP.map(([id])=>[id,parseAmt(d.expenses[id])]).filter(([,v])=>v>0)),
    patients:{sources:Object.fromEntries(SOURCES.map(([id])=>[id,parseAmt(d.patients.sources[id])]).filter(([,v])=>v>0)),started:parseAmt(d.patients.started),repeat:parseAmt(d.patients.repeat),routed:parseAmt(d.patients.routed)},
    updatedAt:Date.now(), updatedBy:state.uid||""};
  const before = state.months[k] ? calc(k,{settings:state.settings,months:state.months}) : null;
  try{
    await state.db.doc("months/"+k).set(clean);
    const after = calc(k,{settings:state.settings,months:{...state.months,[k]:clean}});
    await addLog(before? `изменил(а) ${mlabel(k).toLowerCase()}: выручка ${rub(before.rev)} → ${rub(after.rev)}, расходы ${rub(before.exp)} → ${rub(after.exp)}.` : `внес(ла) ${mlabel(k).toLowerCase()}: выручка ${rub(after.rev)}, расходы ${rub(after.exp)}.`);
    state.months[k]=clean; state.draft=null; startDraft(k); state.toast=["ok","Сохранено"];
  }catch(err){ state.toast=["err", err&&err.code==="invalid_argument"?"Нет прав на запись. Попросите владельца выдать доступ «Участник».":"Не сохранилось. Проверьте интернет и нажмите ещё раз."]; }
  render();
}
async function deleteMonth(){
  const k=state.draftKey;
  try{ await state.db.doc("months/"+k).delete(); await addLog(`удалил(а) все цифры за ${mlabel(k).toLowerCase()}.`); delete state.months[k]; state.draft=null; state.toast=["ok","Месяц удалён"]; }
  catch(e){ state.toast=["err","Не удалось удалить. Попробуйте ещё раз."]; }
  state.confirmDelete=false; render();
}
async function saveSettings(){
  const sd=state.sdraft;
  const next={name:$("#s-name").value.trim()||"Клиника", target:parseAmt($("#s-target").value)||0, shareAlarm:Math.min(parseAmt($("#s-share").value),100)/100, dropAlarm:Math.min(parseAmt($("#s-drop").value),100)/100,
    doctors:sd.doctors.filter(x=>x.name.trim()).map(x=>({id:x.id,name:x.name.trim(),pct:parseAmt(x.pct),dirs:x.dirs||[]}))};
  try{ await state.db.doc("settings/main").set(next); await addLog("изменил(а) настройки клиники."); state.settings=next; state.sdraft=null; state.stoast=["ok","Настройки сохранены"]; }
  catch(e){ state.stoast=["err","Не сохранилось: нужны права редактора."]; }
  render();
}

/* ---------- boot ---------- */
try{ if(location.hash==="#demo" || new URLSearchParams(location.search).get("demo")==="1"){ state.demo=true; state.tab="overview"; state.selKey="2026-09"; } }catch(e){}
render();
(async()=>{
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  const user = window.claude && window.claude.use ? await window.claude.use("user") : null;
  state.db=db; state.user=user;
  if(user){ try{ state.uid=await user.id(); }catch(e){} try{ const w=await user.can("data.write"); state.canWrite = w!==false; }catch(e){ state.canWrite=true; } try{ state.canEdit=!!(await user.canEdit()); }catch(e){} }
  if(!db){ state.canWrite=false; state.ready=true; return render(); }
  db.doc("settings/main").onSnapshot(s=>{ state.settings = s.exists? {...DEFAULT_SETTINGS, ...s.data()} : {...DEFAULT_SETTINGS}; state.ready=true; if(state.tab!=="settings"||!state.sdraft) render(); }, ()=>{});
  db.collection("months").onSnapshot(q=>{
    const m={}; q.docs.forEach(d=>m[d.id]=d.data()); const first=!Object.keys(state.months).length; state.months=m; state.ready=true;
    const ks=Object.keys(m).sort(); if(first && ks.length && !m[state.selKey]) state.selKey=ks[ks.length-1];
    if(state.tab!=="entry") render();
  }, ()=>{});
  db.collection("log").orderBy("at","desc").limit(200).onSnapshot(q=>{ state.log=q.docs.map(d=>d.data()); if(state.tab==="history") render(); }, ()=>{});
})();
})();
</script>
